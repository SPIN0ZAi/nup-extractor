name: CI Verification (Build & Test)

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Test & Package Verification
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cargo Cache
      uses: Swatinem/rust-cache@v2

    - name: Setup .NET SDK (Legacy Parity Suite)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy Lints
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run Automated Test Suite
      run: cargo test --workspace

    - name: Run Legacy .NET Parity Tests
      run: dotnet test legacy_dotnet/NupExtractor.slnx -c Release --verbosity normal

    - name: Build Standalone Release Executable
      run: cargo build --release -p nup-extractor

    - name: Verify Standalone Executable Packaging
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist_verify
        Copy-Item target/release/NUP_Extractor.exe dist_verify/NUP_Extractor.exe
        Get-Item dist_verify/NUP_Extractor.exe

