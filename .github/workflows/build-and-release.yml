name: Build & Release NUP Extractor

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'website/**'
      - 'pictures/**'
      - 'docs/**'
      - 'README.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/deploy-pages.yml'
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cargo Cache
      uses: Swatinem/rust-cache@v2

    - name: Setup .NET SDK (Legacy Parity Suite)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Determine Release Tag (Auto-Increment)
      id: tag_version
      shell: pwsh
      run: |
        git fetch --tags --force
        $tags = git tag -l "v*"
        $parsedTags = @()
        foreach ($t in $tags) {
            if ($t -match '^v?(\d+)\.(\d+)\.(\d+)$') {
                $v = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
                $parsedTags += [pscustomobject]@{ Tag = $t; Ver = $v }
            }
        }
        $parsedTags = $parsedTags | Sort-Object Ver

        if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            $rawVer = $tag.TrimStart('v')
            $curVerObj = $null
            if ($rawVer -match '^(\d+)\.(\d+)\.(\d+)$') {
                $curVerObj = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
            }
            $prevEntry = $parsedTags | Where-Object { $curVerObj -eq $null -or $_.Ver -lt $curVerObj } | Select-Object -Last 1
            $prevTag = if ($prevEntry) { $prevEntry.Tag } else { "" }
            Write-Host "Triggered by explicit tag push: $tag (previous: $prevTag)"
        } else {
            $latestEntry = $parsedTags | Select-Object -Last 1
            if ($latestEntry) {
                $maxMajor = $latestEntry.Ver.Major
                $maxMinor = $latestEntry.Ver.Minor
                $maxPatch = $latestEntry.Ver.Build
                $prevTag = $latestEntry.Tag
            } else {
                $maxMajor = 1
                $maxMinor = 0
                $maxPatch = 0
                $prevTag = ""
            }
            $nextPatch = $maxPatch + 1
            $tag = "v$maxMajor.$maxMinor.$nextPatch"
            $rawVer = "$maxMajor.$maxMinor.$nextPatch"
            Write-Host "Auto-incremented release tag from latest ($prevTag) to: $tag (Version: $rawVer)"
        }

        "PREV_TAG=$prevTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "RELEASE_VERSION=$rawVer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Check Formatting & Clippy
      run: |
        cargo fmt --all -- --check
        cargo clippy --workspace --all-targets -- -D warnings

    - name: Run Automated Test Suite
      env:
        NUP_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      run: |
        cargo test --workspace
        dotnet test legacy_dotnet/NupExtractor.slnx -c Release --verbosity normal

    - name: Build Standalone Release Executable
      env:
        NUP_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      run: cargo build --release -p nup-extractor

    - name: Package Release Assets
      shell: pwsh
      run: |
        $bundleDir = Join-Path (Get-Location) "release_bundle"
        New-Item -ItemType Directory -Force $bundleDir | Out-Null
        Copy-Item target/release/NUP_Extractor.exe "$bundleDir/NUP_Extractor.exe"
        Copy-Item README.md "$bundleDir/"
        Copy-Item LICENSE "$bundleDir/"

        New-Item -ItemType Directory -Force release_assets | Out-Null
        Copy-Item target/release/NUP_Extractor.exe release_assets/NUP_Extractor.exe
        Compress-Archive -Path "$bundleDir/*" -DestinationPath release_assets/NUP_Extractor-windows-x64.zip -Force

        # Generate BOM-free lowercase SHA256 checksums for both standalone exe and zip bundle
        $hashZip = (Get-FileHash release_assets/NUP_Extractor-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
        $hashExe = (Get-FileHash release_assets/NUP_Extractor.exe -Algorithm SHA256).Hash.ToLowerInvariant()
        $sumLines = @(
            "$hashExe  NUP_Extractor.exe",
            "$hashZip  NUP_Extractor-windows-x64.zip"
        )
        $sumPath = Join-Path (Get-Location) "release_assets/SHA256SUMS.txt"
        [System.IO.File]::WriteAllLines($sumPath, $sumLines, [System.Text.UTF8Encoding]::new($false))
        Write-Host "Generated SHA-256 Checksums"
        Get-Content $sumPath

        # Generate release notes specific to this release (curated file if present, else commits since previous tag)
        $releaseTag = $env:RELEASE_TAG
        $prevTag = $env:PREV_TAG
        $notesPath = Join-Path (Get-Location) "release_assets/RELEASE_NOTES.md"
        $customNotesFile = Join-Path (Get-Location) "docs/release-notes/$releaseTag.md"

        if (Test-Path $customNotesFile) {
            $notesLines = [System.IO.File]::ReadAllLines($customNotesFile)
        } else {
            $range = if ($prevTag) { "$prevTag..HEAD" } else { "HEAD" }
            $rawSubjects = @(git log $range --no-merges --pretty=format:"%s") | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            $changeBullets = New-Object System.Collections.Generic.List[string]
            $seen = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::OrdinalIgnoreCase)

            foreach ($subj in $rawSubjects) {
                $clean = $subj.Trim()
                if ($clean -match '^Merge\s+pull\s+request' -or $clean -match '^chore\(release\)') {
                    continue
                }
                if ($clean -match '^(feat|fix|perf|docs|ci|refactor|style|test)(\([^)]+\))?:\s*(.+)$') {
                    $kind = switch ($Matches[1]) {
                        'feat' { 'New' }
                        'fix' { 'Fix' }
                        'perf' { 'Speed' }
                        'docs' { 'Docs' }
                        'ci' { 'CI' }
                        default { 'Update' }
                    }
                    $desc = $Matches[3].Trim()
                    if ($desc.Length -gt 1) {
                        $desc = $desc.Substring(0, 1).ToUpperInvariant() + $desc.Substring(1)
                    }
                    $bullet = "- **${kind}:** $desc"
                } else {
                    $bullet = "- $clean"
                }
                if ($seen.Add($bullet)) {
                    $changeBullets.Add($bullet)
                }
            }

            if ($changeBullets.Count -eq 0) {
                $changeBullets.Add("- Stability, compatibility, and packaging improvements for $releaseTag.")
            }

            $notesLines = @(
                "### What's New in NUP Extractor $releaseTag",
                ''
            ) + $changeBullets.ToArray() + @(
                '',
                '### Downloads',
                '- **`NUP_Extractor.exe`** — Portable standalone Windows x64 executable (recommended)',
                '- **`NUP_Extractor-windows-x64.zip`** — Zip archive containing `NUP_Extractor.exe`, `README.md`, and `LICENSE`',
                '- **`SHA256SUMS.txt`** — SHA-256 checksums for verification'
            )
            if ($prevTag -and $env:GITHUB_REPOSITORY) {
                $notesLines += ''
                $notesLines += "**Full Changelog:** https://github.com/$($env:GITHUB_REPOSITORY)/compare/$prevTag...$releaseTag"
            }
        }
        [System.IO.File]::WriteAllLines($notesPath, $notesLines, [System.Text.UTF8Encoding]::new($false))
        Write-Host "Generated Release Notes"
        Get-Content $notesPath

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NUP_Extractor-Windows-x64
        path: release_assets/NUP_Extractor-windows-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: NUP Extractor ${{ env.RELEASE_TAG }}
        body_path: release_assets/RELEASE_NOTES.md
        files: |
          release_assets/NUP_Extractor.exe
          release_assets/NUP_Extractor-windows-x64.zip
          release_assets/SHA256SUMS.txt
        draft: false
        prerelease: false
        generate_release_notes: false
